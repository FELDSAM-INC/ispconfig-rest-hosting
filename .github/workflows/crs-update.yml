name: crs-update

# Weekly (spec 047): move waf-server/crs.json to the newest signed release of its OWASP CRS LTS line and to the newest
# commits of the official rule exclusion plugins behind the application profiles, check it on the native Apache and nginx
# engines, commit it to develop, run the tests there and open an issue to release it.
# Scheduled workflows run from the default branch (main), so this starts with the release that contains it.
on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: crs-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - name: Newest signed release of the pinned CRS line and newest plugin commits
        id: crs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          php tools/crs-update.php "$RUNNER_TEMP/crs-update.json"
          status=$?
          set -e
          case "$status" in
            0) echo "changed=yes" >> "$GITHUB_OUTPUT";;
            3) echo "changed=" >> "$GITHUB_OUTPUT";;
            *) exit 1;;
          esac

      - name: Check out ispconfig-rest for the installer checks
        if: steps.crs.outputs.changed != ''
        uses: actions/checkout@v4
        with:
          repository: FELDSAM-INC/ispconfig-rest
          ref: develop
          path: core
          persist-credentials: false

      - name: Native Apache and nginx checks with the new pins
        if: steps.crs.outputs.changed != ''
        run: |
          docker build -q -t ispcp-waf-test tests/Integration/waf
          for engine in apache nginx; do
            docker run --rm -v "$PWD:/app:ro" -w /app ispcp-waf-test bash tests/Integration/waf/check.sh "$engine"
            docker run --rm -v "$PWD:/app:ro" -v "$PWD/core:/core:ro" -e ISPCONFIG_REST_DIR=/core -w /app ispcp-waf-test bash tests/Integration/waf/install.sh "$engine"
          done

      - name: Commit to develop and ask for a release
        if: steps.crs.outputs.changed != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import textwrap
          from pathlib import Path
          temp = Path(os.environ['RUNNER_TEMP'])
          changes = json.loads((temp / 'crs-update.json').read_text())
          update = '`ispconfig-rest server-tools update --components waf --yes`'
          entry, subject, links = '', [], []
          if changes['crs']:
              version = changes['crs']
              notes = 'https://github.com/coreruleset/coreruleset/releases/tag/v' + version
              entry += ('### Security\n\n- OWASP CRS ' + version + ' (LTS), see its [release notes](' + notes + '). Web servers get it with\n'
                        '  ' + update + '.\n\n')
              subject.append('OWASP CRS ' + version)
              links.append(notes)
          if changes['plugins']:
              items = []
              for plugin in changes['plugins']:
                  compare = ('https://github.com/coreruleset/' + plugin['name'] + '-plugin/compare/'
                             + plugin['previous'] + '...' + plugin['commit'])
                  items.append('[' + plugin['name'] + ' ' + plugin['version'] + ' at ' + plugin['commit'][:7] + '](' + compare + ')')
                  links.append(compare)
              entry += ('### Changed\n\n' + textwrap.fill('- Application profiles use the newest upstream rule exclusions (fewer false '
                        'positives): ' + ', '.join(items) + '. Web servers get them with ' + update + '.', 118, subsequent_indent='  ',
                        break_long_words=False, break_on_hyphens=False) + '\n\n')
              subject.append('the newest ' + ', '.join(p['profile'] for p in changes['plugins']) + ' rule exclusions')
          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          if text.count('## [Unreleased]\n') != 1:
              raise SystemExit('CHANGELOG.md needs exactly one [Unreleased] section.')
          changelog.write_text(text.replace('## [Unreleased]\n', '## [Unreleased]\n\n' + entry.rstrip('\n') + '\n', 1))
          subject = ' and '.join(subject)
          (temp / 'subject.txt').write_text('Use ' + subject)
          (temp / 'issue-title.txt').write_text('Ready to release: ' + subject)
          (temp / 'issue-body.txt').write_text(
              'crs-update.yml moved `waf-server/crs.json` on `develop` to ' + subject + ' (CRS signature checked against the pinned '
              'release key, SHA-256 pins, native Apache and nginx checks passed):\n\n' + '\n'.join('- ' + link for link in links)
              + '\n\nRelease it as a hosting patch release, then on the panel run `ispconfig-rest extension:update hosting --tag vX.Y.Z '
              '&& ispconfig-rest server-tools update --components waf --yes` (or pin the release in ispconfig-ansible).\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add waf-server/crs.json CHANGELOG.md
          git commit -s -m "$(cat "$RUNNER_TEMP/subject.txt")" -m "Checked on the native Apache and nginx engines by crs-update.yml."
          git push origin HEAD:develop
          gh workflow run tests.yml --ref develop
          gh issue create --title "$(cat "$RUNNER_TEMP/issue-title.txt")" --body-file "$RUNNER_TEMP/issue-body.txt"
