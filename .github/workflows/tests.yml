name: tests

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check server tools, workers and the command entry point
        run: |
          python3 -m unittest discover -s tests/Integration/server-tools -p 'test_*.py'
          python3 -m unittest discover -s tests/WordPress -p 'test_*.py'
          bash -n bin/ispconfig-rest-extension php-limits/install.sh dns-catalog/install.sh
          sh -n php-limits/ispconfig-php-limits worker/install.sh file-manager-worker/install.sh file-manager-worker/wordpress-install.sh

  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      # The extension runs inside ispconfig-rest: develop is tested with its develop branch, main and releases with main.
      - name: Check out ispconfig-rest
        uses: actions/checkout@v4
        with:
          repository: FELDSAM-INC/ispconfig-rest
          ref: ${{ (github.ref == 'refs/heads/develop' || github.base_ref == 'develop') && 'develop' || 'main' }}
          path: core

      - name: Check out the extension
        uses: actions/checkout@v4
        with:
          path: core/extensions/hosting

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, openssl, tokenizer, xml, ctype, bcmath, fileinfo
          coverage: none

      - name: Install ispconfig-rest
        working-directory: core
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        working-directory: core/extensions/hosting
        run: ../../vendor/bin/phpunit

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tools, phpunit]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate release metadata and prepare notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          tag = os.environ['RELEASE_TAG']
          version = Path('VERSION').read_text().strip()
          if not re.fullmatch(r'v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?', tag) or tag != 'v' + version:
              raise SystemExit('Release tag must match VERSION.')
          if json.loads(Path('extension.json').read_text()).get('version') != version:
              raise SystemExit('extension.json version must match VERSION.')
          changelog = Path('CHANGELOG.md').read_text()
          section = re.search(r'^## \[' + re.escape(version) + r'\] - \d{4}-\d{2}-\d{2}\n(.*?)(?=^## |\Z)', changelog, re.M | re.S)
          if not section or not section.group(1).strip():
              raise SystemExit('Release notes are missing from CHANGELOG.md.')
          notes = section.group(1).strip()
          # Changelog paths must remain usable from the GitHub release page.
          notes = re.sub(r'\]\((?!https?://|#)([^)]+)\)',
                         lambda match: '](https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/blob/' + tag + '/' + match.group(1) + ')', notes)
          Path(os.environ['RUNNER_TEMP'], 'release-notes.md').write_text(notes + '\n')
          PY

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_flags=(--verify-tag --title "ISPConfig REST API hosting $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md")
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_flags+=(--prerelease)
          else
            release_flags+=(--latest)
          fi
          gh release create "$RELEASE_TAG" "${release_flags[@]}"
